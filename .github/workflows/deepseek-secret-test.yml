name: P2 — DeepSeek Secret Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-deepseek:
    runs-on: ubuntu-24.04
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Verify secret is present without revealing it
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DIAGNOSIS=DEEPSEEK_API_KEY secret is missing or unavailable to this workflow."
            exit 1
          fi
          echo "DIAGNOSIS=SECRET_PRESENT"

      - name: Test DeepSeek API with safe diagnostics
        shell: bash
        run: |
          set -uo pipefail

          HTTP_CODE="$(curl -sS -o /tmp/deepseek_response.json -w "%{http_code}"             --connect-timeout 15 --max-time 60             https://api.deepseek.com/chat/completions             -H "Authorization: Bearer $DEEPSEEK_API_KEY"             -H "Content-Type: application/json"             -d '{
              "model": "deepseek-flash",
              "messages": [
                {
                  "role": "user",
                  "content": "Reply with exactly the word OK."
                }
              ],
              "max_tokens": 8
            }')"
          CURL_EXIT=$?

          echo "CURL_EXIT=$CURL_EXIT"
          echo "DEEPSEEK_HTTP_STATUS=$HTTP_CODE"

          if [ "$CURL_EXIT" != "0" ]; then
            echo "DIAGNOSIS=NETWORK_OR_CURL_ERROR"
            exit 1
          fi

          if [ "$HTTP_CODE" = "200" ]; then
            python3 - <<'PY'
          import json
          with open("/tmp/deepseek_response.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if data.get("choices"):
              print("DEEPSEEK_STATUS=success")
              print("DIAGNOSIS=DEEPSEEK_API_REACHABLE_AND_AUTHENTICATED")
          else:
              print("DEEPSEEK_STATUS=unexpected_response")
              raise SystemExit(1)
          PY
            echo "API_KEY_NOT_PRINTED=true"
            exit 0
          fi

          python3 - <<'PY'
          import json
          try:
              with open("/tmp/deepseek_response.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
              err = data.get("error", {})
              print("ERROR_TYPE=" + str(err.get("type", "unknown")))
              print("ERROR_CODE=" + str(err.get("code", "unknown")))
              print("ERROR_MESSAGE=" + str(err.get("message", "unknown"))[:300])
          except Exception:
              print("ERROR_BODY=unparseable")
          PY

          echo "DIAGNOSIS=DEEPSEEK_API_REQUEST_FAILED"
          echo "API_KEY_NOT_PRINTED=true"
          exit 1
