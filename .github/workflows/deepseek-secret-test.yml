name: P2 — DeepSeek Secret Connectivity Test

on:
  workflow_dispatch:

jobs:
  test-deepseek:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Verify secret is present without revealing it
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "SECRET_STATUS=missing"
            exit 1
          fi
          echo "SECRET_STATUS=present"

      - name: Test DeepSeek API
        shell: bash
        run: |
          set -euo pipefail

          HTTP_CODE="$(curl -sS -o /tmp/deepseek_response.json -w "%{http_code}" \
            https://api.deepseek.com/chat/completions \
            -H "Authorization: Bearer $DEEPSEEK_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "deepseek-flash",
              "messages": [
                {
                  "role": "user",
                  "content": "Reply with exactly the word OK."
                }
              ],
              "max_tokens": 8
            }')"

          echo "DEEPSEEK_HTTP_STATUS=$HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "DEEPSEEK_STATUS=failed"
            exit 1
          fi

          python3 - <<'PY'
          import json
          with open("/tmp/deepseek_response.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if data.get("choices"):
              print("DEEPSEEK_STATUS=success")
              print("RESPONSE_CONTENT=received")
          else:
              print("DEEPSEEK_STATUS=unexpected_response")
              raise SystemExit(1)
          PY

          echo "API_KEY_NOT_PRINTED=true"
