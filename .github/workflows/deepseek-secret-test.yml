name: P2 - DeepSeek API Test

on:
  workflow_dispatch:

jobs:
  test-deepseek:
    runs-on: ubuntu-24.04
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Check DeepSeek secret
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "RESULT=FAILED"
            echo "REASON=DEEPSEEK_API_KEY_SECRET_MISSING"
            exit 1
          fi
          echo "RESULT=SECRET_OK"

      - name: Call DeepSeek API
        shell: bash
        run: |
          set +e

          HTTP_CODE=$(curl -sS             -o /tmp/deepseek_response.json             -w "%{http_code}"             --connect-timeout 15             --max-time 60             "https://api.deepseek.com/chat/completions"             -H "Authorization: Bearer $DEEPSEEK_API_KEY"             -H "Content-Type: application/json"             -d '{
              "model": "deepseek-flash",
              "messages": [
                {
                  "role": "user",
                  "content": "Reply with exactly OK."
                }
              ],
              "max_tokens": 8
            }')

          CURL_EXIT=$?

          echo "CURL_EXIT=$CURL_EXIT"
          echo "HTTP_STATUS=$HTTP_CODE"

          if [ "$CURL_EXIT" != "0" ]; then
            echo "RESULT=FAILED"
            echo "REASON=NETWORK_OR_CURL_ERROR"
            exit 1
          fi

          if [ "$HTTP_CODE" = "200" ]; then
            echo "RESULT=SUCCESS"
            echo "REASON=DEEPSEEK_API_CONNECTED"
            echo "API_KEY_NOT_PRINTED=true"
            exit 0
          fi

          echo "RESULT=FAILED"
          echo "REASON=DEEPSEEK_API_REJECTED_REQUEST"

          python3 - <<'PY'
import json
try:
    with open("/tmp/deepseek_response.json", "r", encoding="utf-8") as f:
        data = json.load(f)
    err = data.get("error", {})
    print("ERROR_TYPE=" + str(err.get("type", "unknown")))
    print("ERROR_CODE=" + str(err.get("code", "unknown")))
    print("ERROR_MESSAGE=" + str(err.get("message", "unknown"))[:250])
except Exception:
    print("ERROR_BODY=UNPARSEABLE")

print("API_KEY_NOT_PRINTED=true")
PY

          exit 1
