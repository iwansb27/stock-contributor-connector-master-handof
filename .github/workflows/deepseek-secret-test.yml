name: P2 — DeepSeek Secret Connectivity Test
# Manual test workflow — keep this as the single DeepSeek connectivity workflow.

on:
  workflow_dispatch:

jobs:
  test-deepseek:
    runs-on: ubuntu-24.04
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Verify secret is present without revealing it
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "SECRET_STATUS=missing"
            exit 1
          fi
          echo "SECRET_STATUS=present"

      - name: Test DeepSeek API
        shell: bash
        run: |
          set +e
          HTTP_CODE="$(curl -sS -o /tmp/deepseek_response.json -w "%{http_code}" --connect-timeout 15 --max-time 60 "https://api.deepseek.com/chat/completions" -H "Authorization: Bearer $DEEPSEEK_API_KEY" -H "Content-Type: application/json" -d '{"model":"deepseek-flash","messages":[{"role":"user","content":"Reply with exactly the word OK."}],"max_tokens":8}')"
          CURL_EXIT=$?

          echo "CURL_EXIT=$CURL_EXIT"
          echo "DEEPSEEK_HTTP_STATUS=$HTTP_CODE"

          if [ "$CURL_EXIT" != "0" ]; then
            echo "DIAGNOSIS=NETWORK_OR_CURL_ERROR"
            exit 1
          fi

          if [ "$HTTP_CODE" = "200" ]; then
            python3 -c 'import json; data=json.load(open("/tmp/deepseek_response.json", encoding="utf-8")); print("DEEPSEEK_STATUS=success" if data.get("choices") else "DEEPSEEK_STATUS=unexpected_response"); raise SystemExit(0 if data.get("choices") else 1)'
            echo "DIAGNOSIS=DEEPSEEK_API_REACHABLE_AND_AUTHENTICATED"
            echo "API_KEY_NOT_PRINTED=true"
            exit 0
          fi

          python3 -c 'import json; f=open("/tmp/deepseek_response.json", encoding="utf-8"); data=json.load(f); err=data.get("error", {}); print("ERROR_TYPE="+str(err.get("type","unknown"))); print("ERROR_CODE="+str(err.get("code","unknown"))); print("ERROR_MESSAGE="+str(err.get("message","unknown"))[:300])'
          echo "DIAGNOSIS=DEEPSEEK_API_REQUEST_FAILED"
          echo "API_KEY_NOT_PRINTED=true"
          exit 1
