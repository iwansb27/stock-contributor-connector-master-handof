name: P2 — DeepSeek Secret Connectivity Test
# Manual test workflow — keep this as the single DeepSeek connectivity workflow.

on:
  workflow_dispatch:

jobs:
  test-deepseek:
    runs-on: ubuntu-24.04
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Verify secret is present without revealing it
        shell: bash
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "SECRET_STATUS=missing"
            exit 1
          fi
          echo "SECRET_STATUS=present"

      - name: Test DeepSeek API
        shell: bash
        run: |
          set +e
          curl -sS             --connect-timeout 15             --max-time 60             -o /tmp/deepseek_response.json             -w "%{http_code}"             "https://api.deepseek.com/chat/completions"             -H "Authorization: Bearer $DEEPSEEK_API_KEY"             -H "Content-Type: application/json"             --data '{"model":"deepseek-flash","messages":[{"role":"user","content":"Reply with exactly the word OK."}],"max_tokens":8}'             > /tmp/deepseek_http_status.txt
          CURL_EXIT=$?
          HTTP_CODE=$(cat /tmp/deepseek_http_status.txt 2>/dev/null)

          echo "CURL_EXIT=$CURL_EXIT"
          echo "DEEPSEEK_HTTP_STATUS=$HTTP_CODE"

          if [ "$CURL_EXIT" != "0" ]; then
            echo "DIAGNOSIS=NETWORK_OR_CURL_ERROR"
            exit 1
          fi

          if [ "$HTTP_CODE" = "200" ]; then
            if grep -q '"choices"' /tmp/deepseek_response.json; then
              echo "DEEPSEEK_STATUS=success"
              echo "DIAGNOSIS=DEEPSEEK_API_REACHABLE_AND_AUTHENTICATED"
              echo "API_KEY_NOT_PRINTED=true"
              exit 0
            fi
            echo "DEEPSEEK_STATUS=unexpected_response"
            echo "DIAGNOSIS=DEEPSEEK_RETURNED_HTTP_200_WITHOUT_CHOICES"
            echo "API_KEY_NOT_PRINTED=true"
            exit 1
          fi

          if grep -q '"error"' /tmp/deepseek_response.json; then
            echo "DEEPSEEK_ERROR_RESPONSE_RECEIVED=true"
          else
            echo "DEEPSEEK_ERROR_RESPONSE_RECEIVED=false"
          fi

          echo "DIAGNOSIS=DEEPSEEK_API_REQUEST_FAILED"
          echo "API_KEY_NOT_PRINTED=true"
          exit 1
