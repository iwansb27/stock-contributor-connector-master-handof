name: Deploy P2 to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload P2 artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './p2'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
